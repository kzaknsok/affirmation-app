<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声読み上げプレーヤー</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

    :root {
      --bg-color: #f7f5f0;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(212, 184, 150, 0.35);
      
      --text-primary: #1c2331;
      --text-secondary: #7a7369;
      --accent-gold: #c5a059;
      
      --neon-glow-primary: rgba(230, 160, 110, 0.45);
      --neon-glow-secondary: rgba(212, 175, 55, 0.35);
      --btn-grad-start: #1c2536;
      --btn-grad-end: #0f1623;
      
      --modal-bg: rgba(253, 252, 250, 0.95);
      --border-light: rgba(226, 218, 205, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Serif JP', -apple-system, BlinkMacSystemFont, serif;
      background: radial-gradient(circle at 50% 20%, #fefcf9 0%, #f4eee5 100%);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .player-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 440px;
      padding: 40px 28px 48px;
      border-radius: 32px;
      border: 1px solid var(--card-border);
      box-shadow: 
        0 20px 40px -15px rgba(180, 160, 130, 0.15),
        0 0 80px -20px rgba(255, 255, 255, 0.8) inset;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 32px;
      position: relative;
    }

    /* ヘッダー＆設定ボタン */
    .card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-brand {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--accent-gold);
      text-transform: uppercase;
      font-weight: 700;
    }

    .settings-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 6px;
      border-radius: 50%;
      transition: color 0.2s, background-color 0.2s;
    }

    .settings-icon-btn:hover {
      color: var(--text-primary);
      background-color: rgba(197, 160, 89, 0.1);
    }

    .settings-icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* タイトル選択エリア */
    .title-selector {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 100%;
      padding: 8px 12px;
      border-radius: 16px;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .title-selector:hover {
      background-color: rgba(197, 160, 89, 0.06);
    }

    .title-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.1em;
    }

    .current-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      word-break: break-word;
    }

    .dropdown-icon {
      font-size: 0.75rem;
      color: var(--accent-gold);
      transition: transform 0.3s ease;
    }

    /* ソフトネオングローボタン */
    .play-btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn-wrapper::before {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--neon-glow-primary) 0%, var(--neon-glow-secondary) 60%, transparent 100%);
      filter: blur(16px);
      opacity: 0.85;
      transition: all 0.4s ease;
      animation: neonPulse 3.5s infinite alternate ease-in-out;
    }

    @keyframes neonPulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 0.95; }
    }

    .play-btn {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--btn-grad-start), var(--btn-grad-end));
      color: #fdfaf5;
      border: 1px solid rgba(212, 184, 150, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 10px 25px rgba(15, 22, 35, 0.25),
        0 0 15px rgba(230, 160, 110, 0.3) inset;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-tap-highlight-color: transparent;
      z-index: 1;
    }

    .play-btn:active { transform: scale(0.92); }
    .play-btn svg { width: 32px; height: 32px; fill: #fdfaf5; }

    /* モーダル共通構造 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(28, 35, 49, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 100;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--modal-bg);
      width: 100%;
      max-width: 480px;
      max-height: 80dvh;
      border-radius: 32px 32px 0 0;
      padding: 32px 24px;
      border-top: 1px solid rgba(212, 184, 150, 0.4);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-content { transform: translateY(0); }

    @media (min-width: 640px) {
      .modal-overlay { align-items: center; }
      .modal-content {
        border-radius: 32px;
        border: 1px solid rgba(212, 184, 150, 0.4);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--text-secondary);
      cursor: pointer;
    }

    /* 設定項目のデザイン */
    .setting-group {
      margin-bottom: 24px;
      text-align: left;
    }

    .setting-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    /* カスタムスライダー */
    .range-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border-light);
      outline: none;
      accent-color: var(--accent-gold);
    }

    /* リスト要素 */
    .playlist {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .playlist-item {
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
    }

    .playlist-item.active {
      border-color: var(--accent-gold);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(247, 241, 230, 0.8));
    }

    .item-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .playlist-item.active .item-title {
      color: #9e7a33;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- メインプレーヤーカード -->
  <main class="player-card">
    <div class="card-header">
      <div style="width: 28px;"></div> <!-- レイアウト調整用スペース -->
      <div class="app-brand">Speech Player</div>
      <button class="settings-icon-btn" id="btn-open-settings" aria-label="設定を開く">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>

    <button class="title-selector" id="btn-open-list" aria-label="コンテンツリストを開く">
      <span class="title-label">選択中のコンテンツ</span>
      <div class="current-title">
        <span id="display-title">読み込み中...</span>
        <span class="dropdown-icon">▼</span>
      </div>
    </button>

    <div class="play-btn-wrapper">
      <button class="play-btn" id="btn-play" aria-label="再生・一時停止">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </main>

  <!-- リストモーダル -->
  <div class="modal-overlay" id="modal-list">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">コンテンツ一覧</span>
        <button class="close-btn" id="btn-close-list">&times;</button>
      </div>
      <ul class="playlist" id="playlist"></ul>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="modal-settings">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">再生設定</span>
        <button class="close-btn" id="btn-close-settings">&times;</button>
      </div>
      
      <!-- 速度コントロール -->
      <div class="setting-group">
        <div class="setting-label">
          <span>再生速度</span>
          <span id="rate-value">1.0x</span>
        </div>
        <input type="range" id="rate-range" class="range-slider" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>

      <!-- 音量コントロール -->
      <div class="setting-group">
        <div class="setting-label">
          <span>音量</span>
          <span id="volume-value">100%</span>
        </div>
        <input type="range" id="volume-range" class="range-slider" min="0" max="1" step="0.05" value="1">
      </div>
    </div>
  </div>

  <script>
    let playlistData = [];
    let currentIndex = 0;
    let isPlaying = false;
    let playbackRate = 1.0;
    
    // オーディオ要素の設定
    const audio = new Audio();

    // DOM要素
    const displayTitle = document.getElementById('display-title');
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const playlistEl = document.getElementById('playlist');

    // モーダル関連
    const modalList = document.getElementById('modal-list');
    const modalSettings = document.getElementById('modal-settings');
    const btnOpenList = document.getElementById('btn-open-list');
    const btnCloseList = document.getElementById('btn-close-list');
    const btnOpenSettings = document.getElementById('btn-open-settings');
    const btnCloseSettings = document.getElementById('btn-close-settings');

    // 設定要素
    const rateRange = document.getElementById('rate-range');
    const rateValue = document.getElementById('rate-value');
    const volumeRange = document.getElementById('volume-range');
    const volumeValue = document.getElementById('volume-value');

    // SVG アイコン
    const SVG_PLAY = '<path d="M8 5v14l11-7z"/>';
    const SVG_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    // JSONデータの読み込み部分を以下のように調整
    async function loadData() {
      try {
        const response = await fetch('script.json');
        if (!response.ok) throw new Error('Network error');
        
        const rawData = await response.json();
        
        // 文字列の配列なら、自動的に { title, file } のオブジェクト配列に整形する
        playlistData = rawData.map(item => {
          if (typeof item === 'string') {
            return {
              title: item.replace(/\.[^/.]+$/, ""), // 拡張子をカットして表示名にする
              file: item                            // 元のファイル名
            };
          }
          return item; // すでにオブジェクト形式ならそのまま
        });
        
        if (playlistData.length > 0) {
          loadTrack(currentIndex);
          renderPlaylist();
        } else {
          displayTitle.textContent = "データが存在しません";
        }
      } catch (error) {
        console.error(error);
        displayTitle.textContent = "読み込みエラー";
      }
    }

    // トラックの読み込み（パス解決対応）
    function loadTrack(index) {
      const item = playlistData[index];
      if (!item) return;

      // item.file が指定されていれば優先、無ければ file_1.wav のようにフォールバック
      let fileSrc = item.file || item.filename || `file_${index + 1}.wav`;
      
      // 'audio/' ディレクトリ補正
      if (!fileSrc.startsWith('audio/') && !fileSrc.startsWith('/audio/')) {
        fileSrc = `audio/${fileSrc}`;
      }

      audio.src = fileSrc;
      audio.playbackRate = playbackRate;
      updateUI();
    }

    function updateUI() {
      const item = playlistData[currentIndex];
      displayTitle.textContent = item ? item.title : "";
      playIcon.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      playlistData.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        li.innerHTML = `<div class="item-title">${item.title}</div>`;
        li.addEventListener('click', () => {
          selectTrack(index);
          closeModal(modalList);
        });
        playlistEl.appendChild(li);
      });
    }

    function selectTrack(index) {
      currentIndex = index;
      loadTrack(currentIndex);
      renderPlaylist();
      playAudio();
    }

    function togglePlay() {
      if (playlistData.length === 0) return;

      if (isPlaying) {
        audio.pause();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      audio.play().then(() => {
        isPlaying = true;
        updateUI();
      }).catch(error => {
        console.error("再生エラー:", error);
        isPlaying = false;
        updateUI();
      });
    }

    // オーディオイベントの設定
    audio.addEventListener('play', () => {
      isPlaying = true;
      updateUI();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      updateUI();
    });

    // 連続再生処理（トラック終了時）
    audio.addEventListener('ended', () => {
      if (currentIndex < playlistData.length - 1) {
        currentIndex++;
        loadTrack(currentIndex);
        renderPlaylist();
        playAudio();
      } else {
        isPlaying = false;
        updateUI();
      }
    });

    // モーダル制御
    function openModal(modal) { modal.classList.add('open'); }
    function closeModal(modal) { modal.classList.remove('open'); }

    // イベント設定
    btnPlay.addEventListener('click', togglePlay);
    btnOpenList.addEventListener('click', () => openModal(modalList));
    btnCloseList.addEventListener('click', () => closeModal(modalList));
    btnOpenSettings.addEventListener('click', () => openModal(modalSettings));
    btnCloseSettings.addEventListener('click', () => closeModal(modalSettings));

    [modalList, modalSettings].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal(modal);
      });
    });

    // 設定変更
    rateRange.addEventListener('input', (e) => {
      playbackRate = parseFloat(e.target.value);
      audio.playbackRate = playbackRate;
      rateValue.textContent = `${playbackRate.toFixed(1)}x`;
    });

    volumeRange.addEventListener('input', (e) => {
      const volume = parseFloat(e.target.value);
      audio.volume = volume;
      volumeValue.textContent = `${Math.round(volume * 100)}%`;
    });

    // 初期化
    loadData();
  </script>
</body>
</html>
